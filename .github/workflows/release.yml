name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CARD_VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oP "CARD_VERSION = '\K[^']+" air-conditioner-card.js)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but CARD_VERSION in air-conditioner-card.js is $FILE_VERSION"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: air-conditioner-card.js
          generate_release_notes: true
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
