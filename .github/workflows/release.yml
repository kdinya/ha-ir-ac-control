name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.5.0, no leading v)'
        required: true
        type: string
      notes:
        description: 'What changed (release notes, one item per line)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Resolve version and tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify CARD_VERSION matches
        run: |
          FILE_VERSION=$(grep -oP "CARD_VERSION = '\K[^']+" air-conditioner-card.js)
          if [ "${{ steps.resolve.outputs.version }}" != "$FILE_VERSION" ]; then
            echo "::error::Requested version ${{ steps.resolve.outputs.version }} but CARD_VERSION in air-conditioner-card.js is $FILE_VERSION. Update the file first."
            exit 1
          fi
          echo "Version check passed: $FILE_VERSION"

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists on remote."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          files: air-conditioner-card.js
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' || inputs.notes == null }}
          name: ${{ steps.resolve.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
